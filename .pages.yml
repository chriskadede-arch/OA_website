# Pages CMS dashboard configuration (https://pagescms.org)
# GENERATED by oceans-alive/scripts/generate-cms-config.mjs - edit that script, then run `npm run cms:config`.

media:
  input: oceans-alive/public/images
  output: /images
  categories:
    - image
  rename: safe
settings:
  content:
    merge: true
content:
  - name: blog
    label: Blog posts
    type: collection
    path: oceans-alive/content/blog
    format: yaml-frontmatter
    filename: '{fields.title}.md'
    view:
      fields:
        - title
        - status
        - category
        - date
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        default: Published
        description: >-
          Published = live on the website. Coming soon = the card shows but the story says "being updated". Draft =
          hidden everywhere.
        options:
          values:
            - Published
            - Coming soon
            - Draft
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Coral Restoration
            - Women & Ocean
            - Fisheries
            - Education
            - Governance
            - Recognition
            - Impact Stories
            - Community News
            - Latest Updates
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Newest stories appear first.
      - name: highlight
        label: Highlight
        type: select
        default: None
        description: Show this story as the big featured card on its category page, or on the main blog page.
        options:
          values:
            - None
            - Top story on its category page
            - Top story on the main blog page
      - name: excerpt
        label: Short summary (shown on story cards)
        type: text
        required: true
      - name: image
        label: Cover photo
        type: image
        required: true
      - name: imageAlt
        label: Cover photo description (alt text)
        type: string
      - name: readTime
        label: Reading time
        type: string
        description: Leave empty to calculate it automatically (e.g. "5 min read").
      - name: stats
        label: Key numbers (short pills, e.g. "120 women")
        type: string
        list: true
      - name: body
        label: Story
        type: rich-text
        description: >-
          Write the story. Use the quote button for pull quotes (put "— Name" on the last line), and the image button
          for photos.
        options:
          format: markdown
