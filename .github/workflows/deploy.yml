name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oceans-alive/package-lock.json

      - name: Install dependencies
        working-directory: oceans-alive
        run: npm ci

      - name: Build static export
        working-directory: oceans-alive
        env:
          NEXT_STATIC_EXPORT: '1'
        run: |
          mv app/api /tmp/api-backup || true
          npm run build
          touch out/.nojekyll

      - name: Copy built site to repo root
        run: |
          cp -r oceans-alive/out/. .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: rebuild static site [skip ci]"
          git push
