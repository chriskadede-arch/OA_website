# Shareable preview copy of the site on GitHub Pages:
#   https://chriskadede-arch.github.io/OA_website/
# Rebuilds on every save to main. The real website is GoDaddy (see deploy-godaddy.yml).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oceans-alive/package-lock.json

      - name: Install dependencies
        working-directory: oceans-alive
        run: npm ci

      - name: Build static export for GitHub Pages
        working-directory: oceans-alive
        run: |
          mv app/api /tmp/api-backup || true
          npm run build:github
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: oceans-alive/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
